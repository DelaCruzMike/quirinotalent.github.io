<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book a Call | Quirino Talent Company</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#050816; overflow-x:hidden; }
    .glass { background:rgba(255,255,255,.05); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.08); }
    .selected { background:#6366f1 !important; border-color:#818cf8 !important; color:white !important; }
    input, select, textarea {
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    input:focus, select:focus, textarea:focus {
      outline:none;
      border-color:#818cf8;
    }
  </style>
</head>

<body class="text-white font-sans min-h-screen">

<section class="px-6 py-16">
  <div class="max-w-6xl mx-auto">

    <div class="text-center mb-12">
      <p class="uppercase tracking-[0.3em] text-indigo-400 mb-4">
        Book a Call
      </p>

      <h1 class="text-5xl font-bold mb-6">
        Schedule a 1-Hour Discovery Call
      </h1>

      <p class="text-gray-400 text-lg max-w-2xl mx-auto">
        Choose an available date and time, then send your booking request to Quirino Talent Company.
      </p>
    </div>

    <div class="grid lg:grid-cols-2 gap-8">

      <div class="glass rounded-3xl p-8">
        <h2 class="text-2xl font-bold mb-6">1. Choose a Date</h2>
        <div id="dateOptions" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>

        <h2 class="text-2xl font-bold mt-10 mb-6">2. Choose a Time Slot</h2>
        <div id="timeOptions" class="grid grid-cols-2 gap-4"></div>
      </div>

      <div class="glass rounded-3xl p-8">
        <h2 class="text-2xl font-bold mb-6">3. Your Details</h2>

        <form id="bookingForm" class="space-y-5">

          <input id="name" type="text" placeholder="Full Name" required
            class="w-full p-4 rounded-xl text-white">

          <input id="email" type="email" placeholder="Email Address" required
            class="w-full p-4 rounded-xl text-white">

          <select id="service" required class="w-full p-4 rounded-xl text-white">
            <option class="bg-[#050816]">OnlyFans Management</option>
            <option class="bg-[#050816]">Social Media Marketing</option>
            <option class="bg-[#050816]">Both Services</option>
            <option class="bg-[#050816]">Not Sure Yet</option>
          </select>

          <select id="contactMethod" required class="w-full p-4 rounded-xl text-white">
            <option class="bg-[#050816]">Email</option>
            <option class="bg-[#050816]">Telegram</option>
            <option class="bg-[#050816]">Discord</option>
            <option class="bg-[#050816]">WhatsApp</option>
          </select>

          <input id="contactInfo" type="text" placeholder="Telegram / Discord / WhatsApp username or number"
            class="w-full p-4 rounded-xl text-white">

          <textarea id="message" rows="5" placeholder="Tell us what you want to discuss..."
            class="w-full p-4 rounded-xl text-white"></textarea>

          <div class="glass rounded-2xl p-5">
            <p class="text-gray-400 mb-2">Selected Appointment</p>
            <p id="summary" class="text-indigo-400 font-bold">
              No date or time selected yet.
            </p>
          </div>

          <button type="submit"
            class="w-full bg-indigo-500 hover:bg-indigo-600 transition py-5 rounded-xl font-bold text-lg">
            Send Booking Request
          </button>

        </form>

        <div class="mt-8 text-center">
          <a href="index.html" class="text-indigo-400 hover:text-indigo-300">
            Return Home
          </a>
        </div>
      </div>

    </div>
  </div>
</section>

<script>
  const dateOptions = document.getElementById("dateOptions");
  const timeOptions = document.getElementById("timeOptions");
  const summary = document.getElementById("summary");

  let selectedDate = "";
  let selectedTime = "";

  const timeSlots = [
    "9:00 AM - 10:00 AM",
    "10:00 AM - 11:00 AM",
    "11:00 AM - 12:00 PM",
    "1:00 PM - 2:00 PM",
    "2:00 PM - 3:00 PM",
    "3:00 PM - 4:00 PM",
    "4:00 PM - 5:00 PM"
  ];

  function updateSummary() {
    if (selectedDate && selectedTime) {
      summary.textContent = selectedDate + " at " + selectedTime;
    } else {
      summary.textContent = "No date or time selected yet.";
    }
  }

  function createDates() {
    const today = new Date();

    for (let i = 1; i <= 14; i++) {
      const date = new Date();
      date.setDate(today.getDate() + i);

      const label = date.toLocaleDateString("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric"
      });

      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.className = "glass rounded-xl p-4 hover:border-indigo-400 transition";

      button.onclick = () => {
        document.querySelectorAll("#dateOptions button").forEach(btn => btn.classList.remove("selected"));
        button.classList.add("selected");
        selectedDate = label;
        updateSummary();
      };

      dateOptions.appendChild(button);
    }
  }

  function createTimes() {
    timeSlots.forEach(slot => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = slot;
      button.className = "glass rounded-xl p-4 hover:border-indigo-400 transition";

      button.onclick = () => {
        document.querySelectorAll("#timeOptions button").forEach(btn => btn.classList.remove("selected"));
        button.classList.add("selected");
        selectedTime = slot;
        updateSummary();
      };

      timeOptions.appendChild(button);
    });
  }

  document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (!selectedDate || !selectedTime) {
      alert("Please select a date and time slot.");
      return;
    }

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const service = document.getElementById("service").value;
    const contactMethod = document.getElementById("contactMethod").value;
    const contactInfo = document.getElementById("contactInfo").value;
    const message = document.getElementById("message").value;

    const subject = encodeURIComponent("New Booking Request - Quirino Talent Company");

    const body = encodeURIComponent(
      "New booking request:\n\n" +
      "Name: " + name + "\n" +
      "Email: " + email + "\n" +
      "Service: " + service + "\n" +
      "Preferred Contact Method: " + contactMethod + "\n" +
      "Contact Info: " + contactInfo + "\n" +
      "Date: " + selectedDate + "\n" +
      "Time: " + selectedTime + "\n\n" +
      "Message:\n" + message
    );

    window.location.href = "mailto:quirinotalentco@gmail.com?subject=" + subject + "&body=" + body;
  });

  createDates();
  createTimes();
</script>

</body>
</html>
