<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apply | Quirino Talent Company</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #050816;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(99,102,241,0.22);
      filter: blur(120px);
      z-index: 0;
    }

    input, select, textarea {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #818cf8;
    }
  </style>
</head>

<body class="text-white font-sans min-h-screen">

  <div class="glow top-0 left-0"></div>
  <div class="glow bottom-0 right-0"></div>

  <section class="relative z-10 px-6 py-20">

    <div class="max-w-4xl mx-auto">

      <div class="text-center mb-14">
        <p class="uppercase tracking-[0.3em] text-indigo-400 mb-4">
          Application
        </p>

        <h1 class="text-5xl font-bold mb-6">
          Work With Quirino Talent
        </h1>

        <p class="text-gray-400 text-lg max-w-2xl mx-auto">
          Fill out the form below and our team will review your application.
        </p>
      </div>

      <form class="glass rounded-3xl p-10 space-y-8">

        <div>
          <label class="block mb-3 text-gray-300">Full Name</label>
          <input type="text" class="w-full p-4 rounded-xl text-white">
        </div>

        <div>
          <label class="block mb-3 text-gray-300">Email Address</label>
          <input type="email" class="w-full p-4 rounded-xl text-white">
        </div>

        <div>
          <label class="block mb-3 text-gray-300">Telegram / Discord</label>
          <input type="text" class="w-full p-4 rounded-xl text-white">
        </div>

        <div>
          <label class="block mb-3 text-gray-300">Service Interested In</label>

          <select class="w-full p-4 rounded-xl text-white">
            <option class="bg-[#050816]">OnlyFans Management</option>
            <option class="bg-[#050816]">Social Media Marketing</option>
            <option class="bg-[#050816]">Both Services</option>
          </select>
        </div>

        <div>
          <label class="block mb-3 text-gray-300">
            Current Monthly Revenue / Budget
          </label>

          <select class="w-full p-4 rounded-xl text-white">
            <option class="bg-[#050816]">Below $1,000</option>
            <option class="bg-[#050816]">$1,000 - $5,000</option>
            <option class="bg-[#050816]">$5,000 - $20,000</option>
            <option class="bg-[#050816]">$20,000+</option>
          </select>
        </div>

        <div>
          <label class="block mb-3 text-gray-300">
            Social Media Links
          </label>

          <textarea rows="4"
            class="w-full p-4 rounded-xl text-white"></textarea>
        </div>

        <div>
          <label class="block mb-3 text-gray-300">
            Tell us about your goals
          </label>

          <textarea rows="6"
            class="w-full p-4 rounded-xl text-white"></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-500 hover:bg-indigo-600 transition py-5 rounded-xl font-bold text-lg">
          Submit Application
        </button>

      </form>

    </div>

  </section>

</body>
</html>
